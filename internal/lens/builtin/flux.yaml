# Flux — verified against flux2 v2.9.5 release manifests and the controllers'
# Go types (kustomize-controller, source-controller, helm-controller, fluxcd/pkg).
#
# Three group/versions, because Flux splits its CRDs across three controllers:
#   kustomize.toolkit.fluxcd.io/v1  — Kustomization (v1 is the ONLY served
#                                     version in 2.9.x; v1beta1/v1beta2 are gone)
#   source.toolkit.fluxcd.io/v1     — GitRepository, OCIRepository,
#                                     HelmRepository (OCI/Helm were promoted
#                                     v1beta2 -> v1; only v1 is served)
#   helm.toolkit.fluxcd.io/v2       — HelmRelease (v2, NOT v2beta1/v2beta2)
#
# `requires` is all-or-nothing (gatePacks), so this pack needs all three
# controllers present. That is the default `flux install` / `flux bootstrap`
# component set; a deliberately trimmed install without helm-controller hides
# the pack rather than showing four kinds and one dead one. Listing only the
# groups that always exist would be wrong in the other direction: a kind whose
# group/version is not in `requires` is a validation error at parse.
#
# Buckets and HelmCharts are NOT declared. Bucket is rare enough that it is not
# worth a fifth resource on the gate — remember the gate also checks the plural
# of EVERY declared kind, so a kind nobody runs still has to be served. HelmChart
# is generated by helm-controller and read-only in practice; the HelmRelease row
# already carries the chart and the version that landed.
#
# Deliberately NOT shipped, so nobody re-adds them:
#   - .status.lastAppliedRevision on HelmRelease — does NOT exist in
#     helm.toolkit.fluxcd.io/v2. The v2 status keys are history[],
#     lastAttemptedRevision, lastAttemptedRevisionDigest, lastReleaseRevision,
#     helmChart, storageNamespace, installFailures, upgradeFailures, inventory.
#     VERSION below reads .status.history[0].chartVersion, which is what was
#     actually installed rather than what was attempted.
#   - .status.lastAppliedRevision / .status.lastAttemptedRevision on
#     GitRepository / OCIRepository / HelmRepository — do not exist. Sources
#     carry .status.artifact.revision instead.
#   - .status.artifact.* on Kustomization and HelmRelease — do not exist; only
#     source kinds have an Artifact.
#   - reconcile.fluxcd.io/forceAt and /resetAt on Kustomization or any source
#     kind — those controllers never read them and their CRD schemas have no
#     lastHandledForceAt/lastHandledResetAt to acknowledge with. HelmRelease only.
#   - A "count of failures" style column: there is no arithmetic in JSONPath and
#     Column.Format has no counter. .status.installFailures/.upgradeFailures are
#     plain ints and would need format: int, but READY plus MESSAGE already say
#     the same thing with the reason attached.
name: flux
requires:
  - kustomize.toolkit.fluxcd.io/v1
  - source.toolkit.fluxcd.io/v1
  - helm.toolkit.fluxcd.io/v2

severities:
  # Ready is a metav1.Condition (meta.ReadyCondition = "Ready"), so .status is
  # exactly "True" / "False" / "Unknown" and nothing else.
  #
  # Unknown is warn, not unknown: on every Flux kind it means "reconciling, or
  # not observed yet" — a transient, and ranking it above the healthy rows for
  # the duration of each reconcile would put half the fleet at the top of the
  # table on a busy cluster. A genuinely missing cell is not graded at all
  # (lensRows skips empty cells).
  flux-ready:
    ok: ["True"]
    warn: ["Unknown"]
    error: ["False"]
    default: unknown
  # .spec.suspend is `bool json:"suspend,omitempty"` on all five kinds, so the
  # normal case serializes as ABSENT — an empty cell, which lensRows skips
  # rather than grades. Only an explicitly suspended object is graded, and warn
  # rather than error: suspending is a decision somebody made, it just has to be
  # visible, because a suspended object stays Ready=True forever and otherwise
  # looks identical to a healthy one.
  flux-suspended:
    warn: ["true"]
    ok: ["false"]
    default: unknown

kinds:
  - key: flux-kustomizations
    name: Kustomizations
    short: ks
    group: Flux
    gvr: kustomize.toolkit.fluxcd.io/v1/kustomizations
    namespaced: true
    columns:
      - {header: NAME, path: .metadata.name}
      - {header: READY, path: '.status.conditions[?(@.type=="Ready")].status', severity: flux-ready}
      - {header: SUSPENDED, path: .spec.suspend, format: bool, severity: flux-suspended}
      # What is deployed, not what was tried: lastAttemptedRevision moves first
      # and would show green-looking progress on a Kustomization that is failing
      # to apply. Revisions read "<ref>@sha1:<40 hex>"; at the reference width
      # (140 cols, `just shot`) the ref plus the first few hash characters is
      # what anyone actually compares against `git log`.
      - {header: REVISION, path: .status.lastAppliedRevision, truncate: 20}
      # No PATH and no SOURCE column. Both are real (.spec.path,
      # .spec.sourceRef.name) and both are constant down the page on the usual
      # single-repo setup, while MESSAGE is the only cell that differs on the row
      # that is broken. The source is one `R` away over the edges below.
      - {header: MESSAGE, path: '.status.conditions[?(@.type=="Ready")].message', truncate: 44}
      - {header: AGE, path: .metadata.creationTimestamp, format: age}
    # No delete: deleting a Kustomization with .spec.prune garbage-collects
    # everything it applied, and k10s's builtin delete is a two-keystroke danger
    # modal with no per-action confirm override.
    actions: [describe, yaml, flux-reconcile, flux-suspend, flux-resume, events, edit]

  - key: flux-gitrepos
    name: GitRepositories
    short: grepo
    group: Flux
    gvr: source.toolkit.fluxcd.io/v1/gitrepositories
    namespaced: true
    columns:
      - {header: NAME, path: .metadata.name}
      - {header: READY, path: '.status.conditions[?(@.type=="Ready")].status', severity: flux-ready}
      - {header: SUSPENDED, path: .spec.suspend, format: bool, severity: flux-suspended}
      # Unlike Fleet's GitRepo, a Flux source table is short and the URLs do
      # differ per row; and when a source is broken the URL and the message are
      # the two cells that explain it. No REF column: the ref is one of
      # branch/tag/semver/commit/name and only one is set, so a single column
      # reading .spec.ref.branch is empty on every tag-pinned row.
      - {header: URL, path: .spec.url, truncate: 40}
      # Sources have no lastAppliedRevision; the artifact is the fetched thing.
      - {header: REVISION, path: .status.artifact.revision, truncate: 20}
      - {header: MESSAGE, path: '.status.conditions[?(@.type=="Ready")].message', truncate: 40}
      - {header: AGE, path: .metadata.creationTimestamp, format: age}
    actions: [describe, yaml, flux-reconcile, flux-suspend, flux-resume, events, edit, delete]

  # OCIRepositories are NOT declared, and the reason is the gate, not the CRD.
  # OCIRepository was promoted to source.toolkit.fluxcd.io/v1 only in
  # source-controller 1.6 / Flux v2.6; before that it is served at v1beta2 and
  # nowhere else. Declaring it would make `requires` pass on a Flux 2.4/2.5
  # cluster — source.toolkit.fluxcd.io/v1 IS served there, by GitRepository and
  # HelmRepository — and then kindsServed would find no `ocirepositories` in
  # that group/version and drop THE WHOLE PACK. Kustomizations, GitRepositories,
  # HelmRepositories and HelmReleases would all vanish with no message,
  # indistinguishable from "Flux is not installed". One kind is not worth
  # hiding the other four on every cluster a version behind.
  - key: flux-helmrepos
    name: HelmRepositories
    short: hrepo
    group: Flux
    gvr: source.toolkit.fluxcd.io/v1/helmrepositories
    namespaced: true
    columns:
      - {header: NAME, path: .metadata.name}
      - {header: READY, path: '.status.conditions[?(@.type=="Ready")].status', severity: flux-ready}
      - {header: SUSPENDED, path: .spec.suspend, format: bool, severity: flux-suspended}
      # "default" or "oci", and it changes everything about how the repo is
      # fetched — an OCI HelmRepository is not even reconciled into an artifact.
      - {header: TYPE, path: .spec.type}
      - {header: URL, path: .spec.url, truncate: 44}
      # No REVISION: a HelmRepository artifact revision is the digest of the
      # generated index.yaml. It changes whenever any chart in the upstream repo
      # changes and matches nothing a human has seen, so the width goes to
      # MESSAGE instead.
      - {header: MESSAGE, path: '.status.conditions[?(@.type=="Ready")].message', truncate: 40}
      - {header: AGE, path: .metadata.creationTimestamp, format: age}
    # No reconcile here, because of the `type: oci` fork above. Since Flux
    # v2.2, HelmRepositoryReconciler does nothing at all for an OCI repo —
    # existing objects even had their status fields removed by a one-time
    # migration. The annotation write would succeed, ackWant would return the
    # token, and .status.lastHandledReconcileAt would never be written by
    # anyone: the spinner runs the full 45s timeout and lands on "sent, no
    # acknowledgement yet" for an object that was never going to answer. A
    # classic (non-OCI) HelmRepository reconciles fine — reconcile it from the
    # HelmRelease row, or with `flux reconcile source helm`.
    actions: [describe, yaml, flux-suspend, flux-resume, events, edit, delete]

  - key: flux-helmreleases
    name: HelmReleases
    short: hr
    group: Flux
    gvr: helm.toolkit.fluxcd.io/v2/helmreleases
    namespaced: true
    columns:
      - {header: NAME, path: .metadata.name}
      - {header: READY, path: '.status.conditions[?(@.type=="Ready")].status', severity: flux-ready}
      - {header: SUSPENDED, path: .spec.suspend, format: bool, severity: flux-suspended}
      # Empty for a release using .spec.chartRef (an OCIRepository or HelmChart
      # reference) instead of an inline .spec.chart — that is a real fork in the
      # API, not a missing field, and the chartRef case is the minority. A
      # second column for chartRef.name would be empty on every other row.
      - {header: CHART, path: .spec.chart.spec.chart}
      # What is INSTALLED. history[0] is the most recent Helm release snapshot;
      # .status.lastAttemptedRevision would show the version of a failed upgrade
      # next to a Ready=False row and read as if it were running.
      - {header: VERSION, path: ".status.history[0].chartVersion"}
      - {header: MESSAGE, path: '.status.conditions[?(@.type=="Ready")].message', truncate: 40}
      - {header: AGE, path: .metadata.creationTimestamp, format: age}
    actions: [describe, yaml, flux-reconcile, flux-suspend, flux-resume, flux-force, flux-reset, events, edit, delete]

actions:
  # `flux reconcile` in one keystroke, without the flux binary: it is a plain
  # merge patch of one annotation. meta.ReconcileRequestAnnotation is
  # "reconcile.fluxcd.io/requestedAt" and every one of the five kinds embeds
  # meta.ReconcileRequestStatus, so .status.lastHandledReconcileAt exists on all
  # of them. The controller echoes the token back, and because this is a
  # SINGLE-key annotate, ackWant returns that token and LensAck does a real
  # value match rather than a presence check.
  #
  # Flux never removes the annotation (unlike Argo CD's refresh), so absence can
  # never be the acknowledgement — the token match is the only correct ack.
  #
  # Caveat, not a bug: {{.Now}} renders RFC3339 at SECOND precision while the
  # flux CLI writes RFC3339Nano. The controller only tests the token for
  # inequality with the last handled one, so two clicks inside the same wall
  # clock second write an identical token and the second is a no-op.
  - id: flux-reconcile
    label: Reconcile now
    verb: annotate
    annotations:
      reconcile.fluxcd.io/requestedAt: "{{.Now}}"
    ack: .status.lastHandledReconcileAt

  # .spec.suspend is a literal YAML bool on purpose: RenderTree only rewrites
  # STRING leaves, so a bare true/false falls through unchanged and reaches the
  # merge patch as a JSON bool. Templating it would send the string "true" into
  # a Go bool field and the API server would reject the patch.
  - id: flux-suspend
    label: Suspend (stop reconciling)
    verb: patch
    confirm: "true"
    notice: Flux stops reconciling this object. Already-deployed resources stay as they are, drift is no longer corrected, and the object keeps reporting its last Ready status.
    patch:
      spec:
        suspend: true
    ack: .spec.suspend

  - id: flux-resume
    label: Resume
    verb: patch
    confirm: "true"
    patch:
      spec:
        suspend: false

  # Force and reset are HelmRelease-only: helmv2.ForceRequestAnnotation
  # ("reconcile.fluxcd.io/forceAt") and ResetRequestAnnotation ("…/resetAt").
  # HandleAnnotationRequest fires only when the forceAt/resetAt value EQUALS
  # requestedAt and both differ from their last-handled values, which is why
  # both keys are written together with the same {{.Now}} token — Vars.Now is
  # computed once per action, so the two leaves render identically.
  #
  # No `ack:` on either, deliberately: ackWant returns "" for an annotate with
  # more than one key, so LensAck would fall back to a PRESENCE check on
  # .status.lastHandledForceAt / .lastHandledResetAt — already populated after
  # the first ever force, so the spinner would clear instantly and lie on every
  # subsequent use. The row's own READY column is the honest feedback.
  - id: flux-force
    label: Force upgrade (re-run Helm)
    verb: annotate
    confirm: "true"
    notice: Runs a Helm upgrade even when nothing changed. Charts with hooks or immutable resources can fail mid-upgrade and leave the release pending.
    annotations:
      reconcile.fluxcd.io/forceAt: "{{.Now}}"
      reconcile.fluxcd.io/requestedAt: "{{.Now}}"

  - id: flux-reset
    label: Reset failure counters
    verb: annotate
    confirm: "true"
    notice: Clears installFailures/upgradeFailures so helm-controller retries a release it has given up on. It does not fix the cause; a broken chart will just fail again.
    annotations:
      reconcile.fluxcd.io/resetAt: "{{.Now}}"
      reconcile.fluxcd.io/requestedAt: "{{.Now}}"

edges:
  # .spec.sourceRef carries kind, name and namespace, but the edge schema can
  # only match one field, so a Kustomization sourced from an OCIRepository has
  # no hop here — ocirepositories is not a declared kind (see above), and an
  # edge may only point at one that is.
  - from: kustomize.toolkit.fluxcd.io/v1/kustomizations
    to: source.toolkit.fluxcd.io/v1/gitrepositories
    via: field
    key: .spec.sourceRef.name
  # The inline-chart form. Releases using .spec.chartRef point at an
  # OCIRepository or a HelmChart instead and are not covered here.
  - from: helm.toolkit.fluxcd.io/v2/helmreleases
    to: source.toolkit.fluxcd.io/v1/helmrepositories
    via: field
    key: .spec.chart.spec.sourceRef.name
